spring:
  profiles:
    active: dev

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.library.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl moved to dev profile
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

jwt:
  secret: ${JWT_SECRET:library-management-system-jwt-secret-key-2026-xinjiang-cai-da}
  expiration: 86400000

sms:
  provider: mock
